name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Go ${{ matrix.go-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.27.x', 'stable']
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum
      - name: Test all packages
        run: go test ./...
      - name: Vet all packages
        run: go vet ./...
      - name: Build all packages
        run: go build ./...

  security:
    name: Race, fuzz, and vulnerability checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Race detection
        run: go test -race ./...
      - name: Fuzz YAML round trips
        run: go test -run '^$' -fuzz '^FuzzDecodeEncode$' -fuzztime=20s -parallel=2 ./codec/yaml
      - name: Fuzz selectors
        run: go test -run '^$' -fuzz '^FuzzParseMatch$' -fuzztime=20s -parallel=2 ./internal/selector
      - name: Install vulnerability checker
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Check reachable vulnerabilities
        run: govulncheck ./...
